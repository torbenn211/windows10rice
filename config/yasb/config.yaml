watch_stylesheet: true
watch_config: true
debug: false

komorebi:
  start_command: "komorebic start --whkd"
  stop_command: "komorebic stop --whkd"
  reload_command: "komorebic stop --whkd && komorebic start --whkd"

bars:
  primary-bar:
    enabled: true
    screens: ['*']
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: false
    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: true
      round_corners: false
      border_color: "#D98324"
    window_flags:
      always_on_top: true
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 30
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ["komorebi_workspaces", "komorebi_active_layout", "active_window"]
      center: ["clock"]
      right: ["traffic", "cpu", "memory", "volume"]

widgets:
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%a %d %b %Y  %H:%M}"
      label_alt: "{%Y-%m-%d %H:%M:%S}"
      timezones: []

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_no_window: ""
      max_length: 52

  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "NET {download_speed} {upload_speed}"
      update_interval: 2000

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "CPU {info[percent][total]}%"
      label_alt: "CPU {info[histograms][cpu_percent]}"
      update_interval: 5000

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "MEM {virtual_mem_percent}%"
      label_alt: "MEM {virtual_mem_free} / {virtual_mem_total}"
      update_interval: 10000

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "VOL {level}"
      label_alt: "VOL {level}"

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "BAT {percent}%"
      label_alt: "BAT {percent}%"
      update_interval: 30000

  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "WM OFFLINE"
      label_workspace_btn: "{index}"
      label_workspace_active_btn: "{index}"
      label_workspace_populated_btn: "{index}"
      label_default_name: "{index}"
      label_zero_index: false
      hide_empty_workspaces: true

  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{icon}"
      layouts: ["bsp", "columns", "rows", "grid", "vertical_stack", "horizontal_stack"]
      layout_icons:
        bsp: "[]="
        columns: "|||"
        rows: "==="
        grid: "###"
        vertical_stack: "[|]"
        horizontal_stack: "[-]"
        monocle: "[M]"
        maximised: "[M]"
        floating: "><>"
        paused: "[!]"
